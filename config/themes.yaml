# Themes taxonomy (analyst prototype)
# ──────────────────────────────────────────────────────────────────────
# Theme lenses are research overlays that re-bin tickers by cross-sector
# theme (banks, coal/energy, renewables, EV/materials, healthcare, etc.).
#
# This is **not** an authoritative classification. It is explicitly
# labelled `ANALYST_DEFINED_PROTOTYPE` and used as a research lens.
#
# Aggregation rule:
#   * PRIMARY memberships are the default assignment for a theme.
#   * A ticker may belong to MULTIPLE themes as `SECONDARY`; the
#     aggregation engine counts the ticker once per theme, but the
#     breadth denominator remains the ticker count for that theme.
#   * Themes with zero PRIMARY tickers are surfaced but marked
#     `DATA_GAP`.

