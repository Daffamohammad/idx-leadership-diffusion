# IDX Leadership Diffusion — provider configuration

# User-visible execution is selected by mode, never by implicit fallback.
default_mode: PUBLIC_PROTOTYPE
mode_map:
  DEMO_FIXTURE: fixture
  PUBLIC_PROTOTYPE: public
  SECTORS_FIXTURE: sectors_fixture
  SECTORS_LIVE: sectors

providers:
  fixture:
    name: demo_fixture
    class: idx_leadership.providers.fixture.FixtureProvider
    enabled: false
    options:
      fixtures_dir: tests/fixtures

  public:
    name: yfinance
    class: idx_leadership.providers.public.YFinanceProvider
    enabled: true
    options:
      request_timeout_seconds: 20
      max_retries: 2
      retry_backoff_seconds: 1.5
      # Cache TTL: how long a raw response may be reused before re-fetching.
      cache_ttl_hours: 12
    default_universe: config/universe.yaml

  sectors_fixture:
    name: sectors_fixture
    class: idx_leadership.providers.sectors_fixture.SectorsFixtureProvider
    enabled: false
    options:
      fixtures_dir: data/fixtures/sectors

  sectors:
    name: sectors
    class: idx_leadership.providers.sectors.SectorsProvider
    enabled: true  # HTTP remains opt-in at runtime via --allow-live.
    options:
      base_url: https://api.sectors.app
      api_key_env: SECTORS_API_KEY
      request_timeout_seconds: 30
      max_retries: 3
      retry_backoff_seconds: 1.5
      cache_ttl_hours: 24
      history_workers: 1
      # Serialize the paid history calls and leave a conservative gap between
      # requests; Sectors documents 429 responses for rate-limit breaches.
      request_interval_seconds: 0.75

  tavily:
    name: tavily
    class: idx_leadership.providers.tavily_client.TavilyClient
    enabled: true  # Used only by explicit web-context commands; never quantitative.
    options:
      base_url: https://api.tavily.com
      api_key_env: TAVILY_API_KEY
      request_timeout_seconds: 20
      max_retries: 2
      cache_ttl_hours: 24

  you:
    name: you
    class: idx_leadership.providers.you_client.YouClient
    enabled: true  # Used only by explicit web-context commands; never quantitative.
    options:
      search_base_url: https://ydc-index.io
      research_base_url: https://api.you.com
      api_key_env: YOU_API_KEY
      request_timeout_seconds: 30
      max_retries: 2
      retry_backoff_seconds: 1.0
      cache_ttl_hours: 24
# Dry-run planning inputs only. These values estimate calls/pages/cache reuse;
# no credit price is inferred here.
refresh_plan:
  page_size: 200
  universe_size: 950
  core:
    - security_master
    - taxonomy
    - market_close
    - benchmark
  enrichment:
    - free_float
    - fundamentals
    - foreign_flow
  deep_dive:
    - broker
    - filings
    - news
    - corporate_actions
